
<!DOCTYPE html>
<html>
<head>
    <title>Blood Bank Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding-top: 100px;
        }
        .login-box {
            background: white;
            width: 300px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 25px;
            background: #b30000;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Blood Bank Login</h2>

        <form method="POST" action="/login">
            <input type="text" name="username"
                   placeholder="Username" required>

            <input type="password" name="password"
                   placeholder="Password" required>

            <br>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
